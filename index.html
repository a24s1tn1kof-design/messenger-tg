<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Messenger-TG</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f4f4f5; --bg3:#e6ebee;
  --text:#000000; --text2:#707579; --text3:#a2acb4;
  --border:#e4e4e4; --border2:#f4f4f5;
  --accent:#517da2; --accent2:#3d6a8f;
  --header:#ffffff; --out:#effdde; --in:#ffffff;
  --hover:#f4f4f5; --active:#517da2;
  --sidebar:#ffffff;
}
body.dark{
  --bg:#17212b; --bg2:#232e3c; --bg3:#0e1621;
  --text:#ffffff; --text2:#8b98a5; --text3:#6c7883;
  --border:#101921; --border2:#232e3c;
  --accent:#5288c1; --accent2:#6da2d8;
  --header:#17212b; --out:#2b5278; --in:#182533;
  --hover:#202b36; --active:#2b5278;
  --sidebar:#17212b;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
*:focus{outline:none}
*:focus-visible{outline:none}
button{-webkit-appearance:none;appearance:none;font-family:inherit}
body{background:var(--bg);height:100vh;overflow:hidden;color:var(--text);transition:.2s}

/* ===== АВТОРИЗАЦИЯ ===== */
.auth-screen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#517da2 0%,#6ab3f3 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;overflow-y:auto;padding:20px}
body.dark .auth-screen{background:linear-gradient(135deg,#17212b 0%,#232e3c 100%)}
.auth-box{background:var(--bg);width:400px;max-width:100%;
  border-radius:14px;padding:36px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;color:var(--text)}
.auth-logo{width:84px;height:84px;margin:0 auto 18px;
  background:var(--accent);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.auth-logo svg{width:52px;height:52px;fill:#fff}
.auth-box h2{font-size:22px;font-weight:600;margin-bottom:6px;color:var(--text)}
.auth-box p{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.45}
.auth-input{width:100%;padding:12px 14px;font-size:16px;
  border:2px solid var(--border);border-radius:10px;outline:none;
  margin-bottom:12px;background:var(--bg);color:var(--text);transition:.2s}
.auth-input:focus{border-color:var(--accent)}
.auth-input.error{border-color:#e53935}
.auth-hint{font-size:12px;color:var(--text3);text-align:left;margin:-8px 0 12px 4px}
.auth-btn{width:100%;padding:13px;background:var(--accent);color:#fff;
  border:none;border-radius:10px;font-size:16px;font-weight:500;
  cursor:pointer;transition:.2s}
.auth-btn:hover{background:var(--accent2)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-btn.secondary{background:var(--bg2);color:var(--accent)}
.auth-btn.secondary:hover{background:var(--border)}
.photo-upload{width:120px;height:120px;margin:0 auto 18px;
  border-radius:50%;background:var(--bg2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;transition:.2s;
  border:2px dashed var(--border)}
.photo-upload:hover{border-color:var(--accent)}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload .cam{width:36px;height:36px;fill:var(--text3)}
.photo-upload .badge{position:absolute;bottom:6px;right:6px;
  width:32px;height:32px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.photo-upload .badge svg{width:15px;height:15px;fill:#fff}
.steps{display:flex;gap:6px;justify-content:center;margin-top:18px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:.2s}
.step-dot.active{background:var(--accent);width:22px;border-radius:4px}

/* ===== ПРИЛОЖЕНИЕ ===== */
.app{display:none;height:100vh}
.app.active{display:flex}
.sidebar{width:380px;min-width:380px;background:var(--sidebar);
  border-right:1px solid var(--border);display:flex;
  flex-direction:column;height:100vh}
.sidebar-header{display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-bottom:1px solid var(--border);height:60px;background:var(--header)}
.icon-btn{width:40px;height:40px;border:none;background:transparent;
  border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
  transition:.15s;color:var(--text2)}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:22px;height:22px;fill:currentColor}
.search-wrap{flex:1}
.search{width:100%;padding:9px 14px;background:var(--bg2);
  border:none;border-radius:20px;outline:none;font-size:14px;color:var(--text)}
.search::placeholder{color:var(--text3)}
.chat-list{flex:1;overflow-y:auto;background:var(--sidebar)}
.chat-item{display:flex;align-items:center;gap:12px;
  padding:9px 12px;cursor:pointer;transition:.15s;
  border-bottom:1px solid var(--border2)}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--active)}
.chat-item.active .chat-name,
.chat-item.active .chat-preview,
.chat-item.active .chat-time{color:#fff}
.avatar{width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,#6ab3f3,#517da2);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;font-size:20px;
  flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name-row{display:flex;align-items:center;gap:4px;justify-content:space-between}
.chat-name{font-size:15px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:12px;color:var(--text3);flex-shrink:0}
.chat-preview{font-size:13.5px;color:var(--text2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verified{width:16px;height:16px;flex-shrink:0}
  .chat-area{flex:1;display:flex;flex-direction:column;height:100vh;
  background:var(--bg3);
  background-image:url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d3dbe0' fill-opacity='0.35'%3E%3Ccircle cx='20' cy='20' r='3'/%3E%3Ccircle cx='65' cy='65' r='2'/%3E%3Ccircle cx='45' cy='45' r='2.5'/%3E%3C/g%3E%3C/svg%3E")}
.chat-header{display:flex;align-items:center;gap:12px;
  padding:0 16px;background:var(--header);
  border-bottom:1px solid var(--border);height:60px}
.chat-header .avatar{width:42px;height:42px;font-size:16px}
.back-btn{display:none}
.chat-header-info{flex:1;min-width:0}
.chat-header-info .chat-name{font-size:16px}
.chat-header-info .status{font-size:13px;color:var(--text2);margin-top:1px}
.messages{flex:1;overflow-y:auto;padding:20px 8%;
  display:flex;flex-direction:column;gap:6px}
.msg{max-width:65%;padding:8px 14px;border-radius:14px;
  font-size:15px;line-height:1.4;word-wrap:break-word;
  position:relative;animation:msgIn .18s ease;
  user-select:text;color:var(--text)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;background:var(--out);
  border-bottom-right-radius:4px}
body.dark .msg.out{color:#fff}
.msg.in{align-self:flex-start;background:var(--in);
  border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg .time{font-size:11px;color:var(--text3);float:right;
  margin:4px 0 0 8px;position:relative;top:2px}
body.dark .msg.out .time{color:#a8c3dc}
.empty-chat{flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;
  text-align:center;padding:20px}
.empty-chat .empty-badge{background:rgba(0,0,0,.2);
  padding:8px 16px;border-radius:20px;font-size:14px;margin-bottom:12px}
.empty-chat h3{font-size:17px;font-weight:500;color:#fff}
.input-area{display:flex;align-items:flex-end;gap:8px;
  padding:10px 16px;background:var(--header);
  border-top:1px solid var(--border)}
.input-area textarea{flex:1;resize:none;border:none;outline:none;
  font-size:15px;font-family:inherit;max-height:120px;
  padding:10px 14px;background:var(--bg2);color:var(--text);
  border-radius:20px;line-height:1.4}
.input-area textarea::placeholder{color:var(--text3)}
.send-btn{width:44px;height:44px;border-radius:50%;
  background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.15s}
.send-btn:hover{background:var(--accent2)}
.send-btn svg{width:22px;height:22px;fill:#fff;margin-left:2px}
.no-chat{flex:1;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px}
.no-chat .pill{background:rgba(0,0,0,.2);padding:8px 18px;border-radius:20px}

/* ===== МОДАЛКИ ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
  z-index:2000;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg);border-radius:12px;padding:24px;
  width:380px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:90vh;overflow-y:auto;color:var(--text)}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--text)}
.modal label{display:block;font-size:13px;color:var(--text2);
  margin-bottom:6px;margin-top:12px}
.modal input[type="text"],.modal input[type="password"]{
  width:100%;padding:11px 14px;border:2px solid var(--border);
  border-radius:10px;outline:none;font-size:15px;
  background:var(--bg);color:var(--text)}
.modal input:focus{border-color:var(--accent)}
.modal-btn{width:100%;padding:12px;background:var(--accent);color:#fff;
  border:none;border-radius:10px;font-size:15px;font-weight:500;
  cursor:pointer;margin-top:12px;transition:.15s}
.modal-btn:hover{background:var(--accent2)}
.modal-btn.danger{background:#e53935}
.modal-btn.danger:hover{background:#c62828}
.modal-btn.secondary{background:var(--bg2);color:var(--text)}
.modal-btn.secondary:hover{background:var(--border)}
.modal-status{font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.modal-status.ok{color:#4caf50}
.modal-status.err{color:#e53935}

/* ===== ПРОФИЛЬ как в ТГ ===== */
.tg-profile{background:var(--bg);border-radius:12px;width:380px;max-width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;color:var(--text)}
.tg-profile-hero{background:linear-gradient(135deg,#517da2,#6ab3f3);
  padding:40px 20px 20px;text-align:center;position:relative}
.tg-profile-hero .big-av{width:110px;height:110px;margin:0 auto;border-radius:50%;
  background:linear-gradient(135deg,#6ab3f3,#517da2);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;font-size:44px;overflow:hidden;
  border:4px solid rgba(255,255,255,.3)}
.tg-profile-hero .big-av img{width:100%;height:100%;object-fit:cover}
.tg-profile-hero h2{color:#fff;font-size:22px;margin-top:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px}
.tg-profile-hero .uname{color:rgba(255,255,255,.85);font-size:14px;margin-top:4px}
.tg-profile-body{padding:0 16px}
.tg-row{display:flex;align-items:center;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--border2);font-size:15px;color:var(--text)}
.tg-row:last-child{border-bottom:none}
.tg-row svg{width:22px;height:22px;fill:var(--text2);flex-shrink:0}
.tg-row .val{margin-left:auto;color:var(--text2);font-size:14px}
.tg-row.click{cursor:pointer;transition:.15s;border-radius:8px}
.tg-row.click:hover{background:var(--hover)}

/* ===== МЕНЮ ===== */
.menu{background:var(--bg);border-radius:12px;padding:8px 0;
  width:300px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--text)}
.menu-item{display:flex;align-items:center;gap:14px;
  padding:13px 20px;cursor:pointer;font-size:15px;
  color:var(--text);transition:.15s;border:none;background:none;
  width:100%;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item svg{width:20px;height:20px;fill:var(--text2);flex-shrink:0}
.menu-item.danger{color:#e53935}
.menu-item.danger svg{fill:#e53935}

/* ===== ТЕМА ===== */
.theme-switch{display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--border2)}
.theme-switch span{font-size:15px;color:var(--text)}
.switch{width:46px;height:26px;background:var(--border);border-radius:13px;
  position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:23px}

@media(max-width:700px){
  .sidebar{width:100%;min-width:0;border-right:none}
  .app.chat-open .sidebar{display:none}
  .chat-area{display:none}
  .app.chat-open .chat-area{display:flex}
  .back-btn{display:flex}
  .messages{padding:16px 12px}
  .msg{max-width:80%}
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box" id="authBox"></div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" id="burgerBtn">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
      <div class="search-wrap">
        <input class="search" placeholder="Поиск" id="searchInput">
      </div>
      <button class="icon-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>
  <div class="chat-area" id="chatArea"></div>
</div>

<div class="modal-overlay" id="overlay"><div id="overlayContent"></div></div>
<script>
const VERIFIED_SVG=`<svg class="verified" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1da1f2"/><path d="M9.6 16.6l-3.6-3.6 1.4-1.4 2.2 2.2 5.6-5.6 1.4 1.4z" fill="#fff"/></svg>`;

let state={user:null,chats:[],activeChatId:null,temp:{},searchQuery:'',theme:'light'};
const authBox=document.getElementById('authBox');
const authScreen=document.getElementById('authScreen');
const app=document.getElementById('app');
const chatListEl=document.getElementById('chatList');
const chatAreaEl=document.getElementById('chatArea');
const overlay=document.getElementById('overlay');
const overlayContent=document.getElementById('overlayContent');

function save(){localStorage.setItem('mtg_state',JSON.stringify(state))}
function load(){try{const r=localStorage.getItem('mtg_state');if(r)state=Object.assign(state,JSON.parse(r))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark')}

window.addEventListener('load',()=>{
  load();applyTheme();
  if(state.user)showApp();else showStepPhone();
});

/* ===== РЕГИСТРАЦИЯ ===== */
function stepsHtml(a){return `<div class="steps">${[1,2,3,4].map(i=>`<div class="step-dot ${i<=a?'active':''}"></div>`).join('')}</div>`}

function showStepPhone(){
  authBox.innerHTML=`
    <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></div>
    <h2>Ваш номер телефона</h2>
    <p>Введите номер для продолжения</p>
    <input class="auth-input" id="inpPhone" placeholder="+7 999 123 45 67" inputmode="tel">
    <button class="auth-btn" id="btnNext">Далее</button>
    ${stepsHtml(1)}`;
  const inp=document.getElementById('inpPhone'),btn=document.getElementById('btnNext');
  const upd=()=>btn.disabled=inp.value.replace(/\D/g,'').length<10;
  inp.addEventListener('input',upd);upd();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()});
  btn.onclick=()=>{state.temp.phone=inp.value.trim();showStepCode()};
  inp.focus();
}

function showStepCode(){
  authBox.innerHTML=`
    <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></div>
    <h2>Введите код</h2>
    <p>Мы отправили SMS на номер<br><b>${esc(state.temp.phone)}</b></p>
    <input class="auth-input" id="inpCode" placeholder="00000" inputmode="numeric" maxlength="5" style="text-align:center;font-size:22px;letter-spacing:6px;font-weight:600">
    <div class="auth-hint" style="text-align:center;margin-top:-4px">Подсказка: <b>12345</b></div>
    <button class="auth-btn" id="btnNext">Далее</button>
    <button class="auth-btn secondary" id="btnBack" style="margin-top:8px">Назад</button>
    ${stepsHtml(2)}`;
  const inp=document.getElementById('inpCode'),btn=document.getElementById('btnNext');
  const upd=()=>btn.disabled=inp.value.length<5;
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,5);upd()});
  upd();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()});
  btn.onclick=()=>{
    if(inp.value!=='12345'){inp.classList.add('error');setTimeout(()=>inp.classList.remove('error'),800);return}
    showStepName();
  };
  document.getElementById('btnBack').onclick=showStepPhone;
  inp.focus();
}

function showStepName(){
  authBox.innerHTML=`
    <h2 style="margin-bottom:4px">Ваш профиль</h2>
    <p>Введите имя и @username</p>
    <input class="auth-input" id="inpName" placeholder="Имя" maxlength="20">
    <input class="auth-input" id="inpUser" placeholder="@username" maxlength="24">
    <div class="auth-hint" id="userHint">Латиница, цифры, _ , минимум 5 символов</div>
    <button class="auth-btn" id="btnNext">Далее</button>
    <button class="auth-btn secondary" id="btnBack" style="margin-top:8px">Назад</button>
    ${stepsHtml(3)}`;
  const inpName=document.getElementById('inpName');
  const inpUser=document.getElementById('inpUser');
  const hint=document.getElementById('userHint');
  const btn=document.getElementById('btnNext');
  const val=()=>{
    const name=inpName.value.trim();
    const un=inpUser.value.replace('@','').trim();
    const ok=/^[a-zA-Z0-9_]{5,}$/.test(un);
    hint.style.color=(un&&!ok)?'#e53935':'var(--text3)';
    btn.disabled=!(name.length>=1&&ok);
  };
  inpName.addEventListener('input',val);
  inpUser.addEventListener('input',()=>{
    let v=inpUser.value.replace(/[^a-zA-Z0-9_@]/g,'');
    if(!v.startsWith('@'))v='@'+v.replace(/@/g,'');
    inpUser.value=v;val();
  });
  inpName.addEventListener('keydown',e=>{if(e.key==='Enter')inpUser.focus()});
  inpUser.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()});
  val();
  btn.onclick=()=>{state.temp.name=inpName.value.trim();state.temp.username='@'+inpUser.value.replace('@','').trim();showStepPhoto()};
  document.getElementById('btnBack').onclick=showStepCode;
  inpName.focus();
}

function showStepPhoto(){
  authBox.innerHTML=`
    <h2 style="margin-bottom:4px">Фото профиля</h2>
    <p>Загрузите аватар (необязательно)</p>
    <div class="photo-upload" id="photoBox">
      <svg class="cam" viewBox="0 0 24 24"><path d="M9 2L7.17 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-3.17L15 2H9zm3 15a5 5 0 110-10 5 5 0 010 10z"/></svg>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none">
    <button class="auth-btn" id="btnDone" style="margin-top:6px">Готово</button>
    <button class="auth-btn secondary" id="btnBack" style="margin-top:8px">Назад</button>
    ${stepsHtml(4)}`;
  const box=document.getElementById('photoBox');
  const input=document.getElementById('photoInput');
  let photoData=null;
  box.onclick=()=>input.click();
  input.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      photoData=ev.target.result;
      box.innerHTML=`<img src="${photoData}"><div class="badge"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>`;
      box.onclick=()=>input.click();
    };
    r.readAsDataURL(f);
  };
  document.getElementById('btnDone').onclick=()=>{
    state.user={name:state.temp.name,username:state.temp.username,phone:state.temp.phone,photo:photoData,verified:false};
    state.chats=[{id:'saved_'+Date.now(),name:'Избранное',username:'@me',photo:null,messages:[],isSaved:true,verified:false}];
    state.activeChatId=state.chats[0].id;
    save();showApp();
  };
  document.getElementById('btnBack').onclick=showStepName;
}
  /* ===== ПРИЛОЖЕНИЕ ===== */
function showApp(){
  authScreen.style.display='none';
  app.classList.add('active');
  renderChats();renderChatArea();
}

function renderChats(){
  const q=state.searchQuery.toLowerCase();
  const list=state.chats.filter(c=>c.name.toLowerCase().includes(q)||(c.username||'').toLowerCase().includes(q));
  if(!list.length){
    chatListEl.innerHTML=`<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:14px">${state.chats.length?'Ничего не найдено':'Нет чатов. Нажмите + чтобы создать'}</div>`;
    return;
  }
  chatListEl.innerHTML=list.map(c=>{
    const last=c.messages[c.messages.length-1];
    const prev=last?(last.text||'📎'):(c.isSaved?'Сохранить сообщения...':'Нет сообщений');
    const t=last?new Date(last.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    const init=c.name[0]?.toUpperCase()||'?';
    const av=c.photo?`<div class="avatar"><img src="${c.photo}"></div>`:`<div class="avatar">${init}</div>`;
    const b=c.verified?VERIFIED_SVG:'';
    return `<div class="chat-item ${c.id===state.activeChatId?'active':''}" data-id="${c.id}">
      ${av}
      <div class="chat-info">
        <div class="chat-name-row">
          <div class="chat-name">${esc(c.name)} ${b}</div>
          <div class="chat-time">${t}</div>
        </div>
        <div class="chat-preview">${esc(prev)}</div>
      </div>
    </div>`;
  }).join('');
  chatListEl.querySelectorAll('.chat-item').forEach(el=>{el.onclick=()=>openChat(el.dataset.id)});
}

function openChat(id){
  state.activeChatId=id;save();
  app.classList.add('chat-open');
  renderChats();renderChatArea();
}

function renderChatArea(){
  const chat=state.chats.find(c=>c.id===state.activeChatId);
  if(!chat){chatAreaEl.innerHTML=`<div class="no-chat"><div class="pill">Выберите чат</div></div>`;return}
  const init=chat.name[0]?.toUpperCase()||'?';
  const av=chat.photo?`<div class="avatar"><img src="${chat.photo}"></div>`:`<div class="avatar">${init}</div>`;
  const b=chat.verified?VERIFIED_SVG:'';
  chatAreaEl.innerHTML=`
    <div class="chat-header">
      <button class="icon-btn back-btn" id="backBtn"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      ${av}
      <div class="chat-header-info">
        <div class="chat-name">${esc(chat.name)} ${b}</div>
        <div class="status">${chat.isSaved?'сохранённые сообщения':'был(а) недавно'}</div>
      </div>
    </div>
    <div class="messages" id="messagesBox"></div>
    <div class="input-area">
      <textarea id="msgInput" placeholder="Написать сообщение..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>`;
  renderMessages(chat);
  document.getElementById('backBtn').onclick=()=>app.classList.remove('chat-open');
  const input=document.getElementById('msgInput'),sendBtn=document.getElementById('sendBtn');
  const send=()=>{
    const text=input.value.trim();if(!text)return;
    chat.messages.push({text,type:'out',ts:Date.now()});
    input.value='';input.style.height='auto';
    save();renderMessages(chat);renderChats();
    if(!chat.isSaved){
      setTimeout(()=>{
        chat.messages.push({text,type:'in',ts:Date.now()});
        save();
        if(state.activeChatId===chat.id)renderMessages(chat);
        renderChats();
      },700);
    }
  };
  sendBtn.onclick=send;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
  input.focus();
}

function renderMessages(chat){
  const box=document.getElementById('messagesBox');if(!box)return;
  if(!chat.messages.length){
    box.innerHTML=`<div class="empty-chat"><div class="empty-badge">${chat.isSaved?'Только вы видите эти сообщения':'Нет сообщений'}</div><h3>${esc(chat.name)}</h3></div>`;
    return;
  }
  box.innerHTML=chat.messages.map(m=>{
    const t=new Date(m.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    return `<div class="msg ${m.type}">${esc(m.text)}<span class="time">${t}</span></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}

document.getElementById('searchInput').addEventListener('input',e=>{state.searchQuery=e.target.value.trim();renderChats()});

/* ===== МОДАЛКИ ===== */
function closeOverlay(){overlay.classList.remove('active');overlayContent.innerHTML=''}
overlay.onclick=e=>{if(e.target===overlay)closeOverlay()};

/* ===== МЕНЮ ===== */
document.getElementById('burgerBtn').onclick=showMenu;
function showMenu(){
  overlayContent.innerHTML=`
    <div class="menu">
      <button class="menu-item" id="mProfile"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Профиль</button>
      <button class="menu-item" id="mSettings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Настройки</button>
      <button class="menu-item" id="mAdmin"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>Админ-панель</button>
      <button class="menu-item danger" id="mLogout"><svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>Выйти</button>
    </div>`;
  overlay.classList.add('active');
  document.getElementById('mProfile').onclick=showProfile;
  document.getElementById('mSettings').onclick=showSettings;
  document.getElementById('mAdmin').onclick=showAdminLogin;
  document.getElementById('mLogout').onclick=()=>{if(confirm('Выйти?')){localStorage.clear();location.reload()}};
  }
  /* ===== ПРОФИЛЬ как в ТГ ===== */
function showProfile(){
  const u=state.user;
  const init=u.name[0]?.toUpperCase()||'?';
  const av=u.photo?`<div class="big-av"><img src="${u.photo}"></div>`:`<div class="big-av">${init}</div>`;
  overlayContent.innerHTML=`
    <div class="tg-profile">
      <div class="tg-profile-hero">
        ${av}
        <h2>${esc(u.name)} ${u.verified?VERIFIED_SVG:''}</h2>
        <div class="uname">${esc(u.username)}</div>
      </div>
      <div class="tg-profile-body">
        <div class="tg-row"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.15 15.15 0 006.59 6.59l2.2-2.2a.99.99 0 011.01-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg>Телефон<span class="val">${esc(u.phone)}</span></div>
        <div class="tg-row"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Имя<span class="val">${esc(u.name)}</span></div>
        <div class="tg-row click" id="profileSettings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/></svg>Изменить профиль</div>
      </div>
      <button class="modal-btn secondary" id="closeProfile" style="margin:12px 16px 16px">Закрыть</button>
    </div>`;
  document.getElementById('closeProfile').onclick=closeOverlay;
  document.getElementById('profileSettings').onclick=showSettings;
}

/* ===== НАСТРОЙКИ как в ТГ ===== */
function showSettings(){
  const u=state.user;
  const init=u.name[0]?.toUpperCase()||'?';
  const av=u.photo?`<div class="tg-profile-hero"><div class="big-av" id="setAvatar" style="cursor:pointer"><img src="${u.photo}"></div></div>`
    :`<div class="tg-profile-hero"><div class="big-av" id="setAvatar" style="cursor:pointer">${init}</div></div>`;
  overlayContent.innerHTML=`
    <div class="tg-profile">
      ${av}
      <input type="file" id="setPhotoInput" accept="image/*" style="display:none">
      <div class="tg-profile-body">
        <label style="display:block;font-size:13px;color:var(--text2);margin-top:12px">Имя</label>
        <input type="text" id="setName" value="${esc(u.name)}" maxlength="20" style="width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;outline:none;font-size:15px;background:var(--bg);color:var(--text)">
        <label style="display:block;font-size:13px;color:var(--text2);margin-top:12px">@username</label>
        <input type="text" id="setUser" value="${esc(u.username)}" maxlength="24" style="width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;outline:none;font-size:15px;background:var(--bg);color:var(--text)">
        <div class="theme-switch" style="margin-top:16px">
          <span>Тёмная тема</span>
          <div class="switch ${state.theme==='dark'?'on':''}" id="themeSwitch"></div>
        </div>
      </div>
      <div style="padding:0 16px 16px">
        <button class="modal-btn" id="saveSettings">Сохранить</button>
        <button class="modal-btn secondary" id="cancelSettings" style="margin-top:8px">Отмена</button>
        <div class="modal-status" id="setStatus"></div>
      </div>
    </div>`;
  let newPhoto=u.photo;
  document.getElementById('setAvatar').onclick=()=>document.getElementById('setPhotoInput').click();
  document.getElementById('setPhotoInput').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{newPhoto=ev.target.result;document.getElementById('setAvatar').innerHTML=`<img src="${newPhoto}">`};
    r.readAsDataURL(f);
  };
  document.getElementById('themeSwitch').onclick=()=>{
    state.theme=state.theme==='dark'?'light':'dark';
    applyTheme();save();
    document.getElementById('themeSwitch').classList.toggle('on',state.theme==='dark');
  };
  document.getElementById('cancelSettings').onclick=closeOverlay;
  document.getElementById('saveSettings').onclick=()=>{
    const name=document.getElementById('setName').value.trim();
    let un=document.getElementById('setUser').value.trim();
    if(!un.startsWith('@'))un='@'+un.replace(/@/g,'');
    if(!name){alert('Введите имя');return}
    if(!/^@[a-zA-Z0-9_]{5,}$/.test(un)){alert('Username: латиница, цифры, _, мин 5');return}
    state.user.name=name;state.user.username=un;state.user.photo=newPhoto;
    save();renderChats();renderChatArea();
    const st=document.getElementById('setStatus');
    st.className='modal-status ok';st.textContent='✓ Сохранено';
    setTimeout(closeOverlay,700);
  };
}

/* ===== НОВЫЙ ЧАТ ===== */
document.getElementById('newChatBtn').onclick=showNewChat;
function showNewChat(){
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>Новый чат</h3>
      <label>Имя собеседника</label>
      <input type="text" id="ncName" placeholder="Иван" maxlength="30">
      <label>@username</label>
      <input type="text" id="ncUser" placeholder="@ivan" maxlength="24">
      <button class="modal-btn" id="ncCreate">Создать</button>
      <button class="modal-btn secondary" id="ncCancel">Отмена</button>
    </div>`;
  const inp=document.getElementById('ncName');inp.focus();
  document.getElementById('ncCancel').onclick=closeOverlay;
  const create=()=>{
    const name=document.getElementById('ncName').value.trim();
    let un=document.getElementById('ncUser').value.trim();
    if(!name){alert('Введите имя');return}
    if(!un)un='@user'+Math.floor(Math.random()*9999);
    if(!un.startsWith('@'))un='@'+un.replace(/@/g,'');
    const chat={id:'chat_'+Date.now(),name,username:un,photo:null,messages:[],isSaved:false,verified:false};
    state.chats.push(chat);state.activeChatId=chat.id;save();
    closeOverlay();app.classList.add('chat-open');
    renderChats();renderChatArea();
  };
  document.getElementById('ncCreate').onclick=create;
  document.getElementById('ncUser').addEventListener('keydown',e=>{if(e.key==='Enter')create()});
  document.getElementById('ncName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ncUser').focus()});
}

/* ===== АДМИН ===== */
function showAdminLogin(){
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>🔐 Админ-панель</h3>
      <input type="password" id="adminPass" placeholder="Пароль">
      <button class="modal-btn" id="adminLoginBtn">Войти</button>
      <button class="modal-btn secondary" id="adminCancelBtn">Отмена</button>
      <div class="modal-status" id="adminStatus"></div>
    </div>`;
  const inp=document.getElementById('adminPass');inp.focus();
  const st=document.getElementById('adminStatus');
  const login=()=>{
    if(inp.value==='1212'){st.className='modal-status ok';st.textContent='✓ Доступ разрешён';setTimeout(showAdminPanel,350)}
    else{st.className='modal-status err';st.textContent='✗ Неверный пароль';inp.value=''}
  };
  document.getElementById('adminLoginBtn').onclick=login;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  document.getElementById('adminCancelBtn').onclick=closeOverlay;
}

function showAdminPanel(){
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>👑 Админ-панель</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Аккаунт: <b>${esc(state.user.name)}</b> ${esc(state.user.username)}</p>
      <button class="modal-btn ${state.user.verified?'danger':''}" id="toggleVerify">${state.user.verified?'Убрать галочку':'Выдать синюю галочку ✓'}</button>
      <button class="modal-btn secondary" id="closeAdmin">Закрыть</button>
      <div class="modal-status" id="adminStatus2"></div>
    </div>`;
  document.getElementById('toggleVerify').onclick=()=>{
    state.user.verified=!state.user.verified;save();
    renderChats();renderChatArea();
    const st=document.getElementById('adminStatus2');
    st.className='modal-status ok';
    st.textContent=state.user.verified?'✓ Галочка выдана!':'✓ Галочка снята';
    setTimeout(showAdminPanel,500);
  };
  document.getElementById('closeAdmin').onclick=closeOverlay;
}
</script>
