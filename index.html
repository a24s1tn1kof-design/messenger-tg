<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Telegram</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f4f4f5; --bg3:#e6ebee; --bg4:#efeff4;
  --text:#000000; --text2:#707579; --text3:#a2acb4;
  --border:#e4e4e4; --border2:#f4f4f5;
  --accent:#517da2; --accent2:#3d6a8f; --blue:#3390ec;
  --header:#ffffff; --out:#effdde; --in:#ffffff;
  --hover:#f4f4f5; --active:#517da2;
  --sidebar:#ffffff; --card:#ffffff;
}
body.dark{
  --bg:#17212b; --bg2:#232e3c; --bg3:#0e1621; --bg4:#0e1621;
  --text:#ffffff; --text2:#8b98a5; --text3:#6c7883;
  --border:#101921; --border2:#232e3c;
  --accent:#5288c1; --accent2:#6da2d8; --blue:#5288c1;
  --header:#17212b; --out:#2b5278; --in:#182533;
  --hover:#202b36; --active:#2b5278;
  --sidebar:#17212b; --card:#182533;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
*:focus{outline:none}
button{-webkit-appearance:none;appearance:none;font-family:inherit}
body{background:var(--bg);height:100vh;overflow:hidden;color:var(--text)}

.auth-screen{position:fixed;inset:0;
  background:linear-gradient(135deg,#517da2 0%,#6ab3f3 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;overflow-y:auto;padding:20px}
body.dark .auth-screen{background:linear-gradient(135deg,#17212b 0%,#232e3c 100%)}
.auth-box{background:var(--bg);width:400px;max-width:100%;
  border-radius:14px;padding:36px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;color:var(--text)}
.auth-logo{width:84px;height:84px;margin:0 auto 18px;
  background:var(--accent);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.auth-logo svg{width:52px;height:52px;fill:#fff}
.auth-box h2{font-size:22px;font-weight:600;margin-bottom:6px}
.auth-box p{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.45}
.auth-input{width:100%;padding:12px 14px;font-size:16px;
  border:2px solid var(--border);border-radius:10px;outline:none;
  margin-bottom:12px;background:var(--bg);color:var(--text)}
.auth-input:focus{border-color:var(--accent)}
.auth-input.error{border-color:#e53935}
.auth-hint{font-size:12px;color:var(--text3);text-align:left;margin:-8px 0 12px 4px}
.auth-btn{width:100%;padding:13px;background:var(--accent);color:#fff;
  border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer}
.auth-btn:hover{background:var(--accent2)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-btn.secondary{background:var(--bg2);color:var(--accent)}
.photo-upload{width:120px;height:120px;margin:0 auto 18px;
  border-radius:50%;background:var(--bg2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;border:2px dashed var(--border)}
.photo-upload:hover{border-color:var(--accent)}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload .cam{width:36px;height:36px;fill:var(--text3)}
.photo-upload .badge{position:absolute;bottom:6px;right:6px;
  width:32px;height:32px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.photo-upload .badge svg{width:15px;height:15px;fill:#fff}
.steps{display:flex;gap:6px;justify-content:center;margin-top:18px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.step-dot.active{background:var(--accent);width:22px;border-radius:4px}

.app{display:none;height:100vh}
.app.active{display:flex}
.sidebar{width:380px;min-width:380px;background:var(--sidebar);
  border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
.sidebar-header{display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-bottom:1px solid var(--border);height:56px;
  background:var(--header);
  padding-top:calc(8px + env(safe-area-inset-top,0px))}
.sidebar-title{font-size:20px;font-weight:700;color:var(--blue);margin-right:auto}
.icon-btn{width:40px;height:40px;border:none;background:transparent;
  border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
  transition:.15s;color:var(--text2);pointer-events:auto}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{background:var(--border)}
.icon-btn svg{width:22px;height:22px;fill:currentColor;pointer-events:none}
.search-wrap{padding:8px 10px}
.search{width:100%;padding:10px 14px;background:var(--bg2);
  border:none;border-radius:10px;outline:none;font-size:15px;color:var(--text)}
.search::placeholder{color:var(--text3)}
.chat-list{flex:1;overflow-y:auto;background:var(--sidebar)}
.chat-item{display:flex;align-items:center;gap:12px;
  padding:10px 14px;cursor:pointer;
  border-bottom:1px solid var(--border2)}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--active)}
.chat-item.active .chat-name,
.chat-item.active .chat-preview,
.chat-item.active .chat-time{color:#fff}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);flex-shrink:0;overflow:hidden}
.avatar svg{width:28px;height:28px;fill:var(--text2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name-row{display:flex;align-items:center;gap:4px;justify-content:space-between}
.chat-name{font-size:16px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:12px;color:var(--text3);flex-shrink:0}
.chat-preview{font-size:14px;color:var(--text2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verified{width:16px;height:16px;flex-shrink:0}
  .chat-area{flex:1;display:flex;flex-direction:column;height:100vh;
  position:relative;
  background:linear-gradient(135deg,#a4c391 0%,#7d9c78 50%,#94b383 100%)}
body.dark .chat-area{background:linear-gradient(135deg,#1b2735 0%,#0e1621 100%)}

.chat-header{position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;gap:6px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;
  z-index:100}
.tg-back{width:40px;height:40px;border-radius:50%;
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15);flex-shrink:0;color:var(--text)}
.tg-back svg{width:20px;height:20px;fill:currentColor;pointer-events:none}
.tg-header-pill{flex:1;display:flex;align-items:center;gap:8px;
  background:var(--bg);border-radius:22px;padding:4px 12px 4px 4px;
  min-width:0;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer;height:40px}
.tg-header-pill .avatar{width:32px;height:32px}
.tg-header-pill .avatar svg{width:18px;height:18px}
.tg-header-info{flex:1;min-width:0;text-align:left}
.tg-header-info .name{font-size:14.5px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-header-info .name .verified{width:13px;height:13px}
.tg-header-info .sub{font-size:11.5px;color:var(--text2);margin-top:1px}
.tg-header-btn{width:40px;height:40px;border-radius:50%;
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15);color:var(--text);flex-shrink:0}
.tg-header-btn svg{width:19px;height:19px;fill:currentColor;pointer-events:none}

.messages{flex:1;overflow-y:auto;
  padding:calc(70px + env(safe-area-inset-top,0px)) 12px 80px;
  display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:8px 14px;border-radius:16px;
  font-size:15px;line-height:1.4;word-wrap:break-word;color:#000}
.msg.out{align-self:flex-end;background:#effdde;border-bottom-right-radius:6px}
body.dark .msg.out{background:#2b5278;color:#fff}
.msg.in{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.dark .msg.in{background:#182533;color:#fff}
.msg .time{font-size:11px;color:#6c7883;float:right;
  margin:4px 0 0 8px;position:relative;top:2px}
.date-sep{align-self:center;background:rgba(0,0,0,.25);
  color:#fff;font-size:12.5px;padding:5px 12px;border-radius:14px;margin:8px 0}

.empty-chat-card{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(120,160,110,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:22px 22px;border-radius:16px;text-align:center;
  color:#fff;max-width:300px;width:calc(100% - 40px)}
.empty-chat-card h4{font-size:15px;font-weight:500;margin-bottom:6px}
.empty-chat-card p{font-size:13.5px;opacity:.9;line-height:1.4;margin-bottom:12px}
.empty-chat-card .sticker{width:100px;height:100px;margin:0 auto;
  background:#fff;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:54px}

.input-area{position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;gap:6px;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.input-pill{flex:1;display:flex;align-items:center;gap:6px;
  background:var(--bg);border-radius:22px;padding:4px 4px 4px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.input-pill textarea{flex:1;resize:none;border:none;outline:none;
  font-size:15px;font-family:inherit;max-height:100px;
  padding:8px 0;background:transparent;color:var(--text)}
.input-pill textarea::placeholder{color:var(--text3)}
.input-icon{width:32px;height:32px;border:none;background:transparent;
  cursor:pointer;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.input-icon svg{width:20px;height:20px;fill:currentColor;pointer-events:none}
.mic-btn{width:42px;height:42px;border-radius:50%;background:var(--blue);
  border:none;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.mic-btn svg{width:20px;height:20px;fill:#fff;pointer-events:none}

.no-chat{flex:1;display:flex;align-items:center;justify-content:center;color:#fff}
.no-chat .pill{background:rgba(0,0,0,.2);padding:8px 18px;border-radius:20px}

/* МОДАЛКИ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
  z-index:2000;padding:8px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg);border-radius:14px;padding:22px;
  width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:92vh;overflow-y:auto;color:var(--text)}
.modal h3{font-size:18px;margin-bottom:16px}
.modal label{display:block;font-size:13px;color:var(--text2);
  margin-bottom:6px;margin-top:12px}
.modal input[type="text"],.modal input[type="password"],.modal input[type="date"]{
  width:100%;padding:11px 14px;border:2px solid var(--border);
  border-radius:10px;outline:none;font-size:15px;
  background:var(--bg);color:var(--text)}
.modal input:focus{border-color:var(--accent)}
.modal-btn{width:100%;padding:12px;background:var(--accent);color:#fff;
  border:none;border-radius:10px;font-size:15px;font-weight:500;
  cursor:pointer;margin-top:12px}
.modal-btn:hover{background:var(--accent2)}
.modal-btn.danger{background:#e53935}
.modal-btn.secondary{background:var(--bg2);color:var(--text)}
.modal-status{font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.modal-status.ok{color:#4caf50}
.modal-status.err{color:#e53935}

/* ПРОФИЛЬ */
.tg-profile{background:var(--bg);border-radius:16px;
  width:100%;max-width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;color:var(--text);
  max-height:96vh;overflow-y:auto;padding-bottom:12px}
.tg-profile-top{padding:26px 16px 16px;text-align:center;position:relative}
.tg-profile-close{position:absolute;top:12px;right:12px;width:32px;height:32px;
  border:none;background:transparent;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text2)}
.tg-profile-close:hover{background:var(--hover)}
.tg-profile-close svg{width:20px;height:20px;fill:currentColor}
.tg-profile-top .big-av{width:104px;height:104px;margin:0 auto;border-radius:50%;
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  color:var(--text2);overflow:hidden}
.tg-profile-top .big-av svg{width:56px;height:56px;fill:var(--text2)}
.tg-profile-top .big-av img{width:100%;height:100%;object-fit:cover}
.tg-profile-top h2{font-size:21px;margin-top:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px}
.tg-profile-top h2 .verified{width:18px;height:18px}
.tg-profile-top .sub{color:var(--text2);font-size:13.5px;margin-top:4px}

.tg-buttons{display:flex;gap:6px;padding:0 10px 10px}
.tg-btn{flex:1;min-width:0;background:var(--bg2);border-radius:12px;
  padding:11px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;border:none;color:var(--text);min-height:70px;justify-content:center}
.tg-btn:hover{background:var(--hover)}
.tg-btn svg{width:21px;height:21px;fill:var(--text);pointer-events:none}
.tg-btn span{font-size:11px;color:var(--text);text-align:center;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%}

.tg-info-card{margin:0 10px 10px;background:var(--card);border-radius:14px;
  overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tg-info-row{padding:12px 14px;border-bottom:1px solid var(--border2)}
.tg-info-row:last-child{border-bottom:none}
.tg-info-row .main{font-size:15.5px;color:var(--text);line-height:1.3;
  word-break:break-word}
.tg-info-row .sub{font-size:12.5px;color:var(--text2);margin-top:3px}

/* DROPDOWN меню чата */
.dropdown{position:absolute;
  top:calc(56px + env(safe-area-inset-top,0px));
  right:8px;background:var(--bg);
  border-radius:12px;padding:6px 0;min-width:190px;
  box-shadow:0 4px 20px rgba(0,0,0,.35);z-index:600;color:var(--text);
  display:none}
.dropdown.show{display:block}
.dropdown-item{padding:11px 16px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:10px;color:var(--text)}
.dropdown-item:hover{background:var(--hover)}
.dropdown-item svg{width:18px;height:18px;fill:var(--text2);flex-shrink:0}
.dropdown-item.danger{color:#e53935}
.dropdown-item.danger svg{fill:#e53935}

.menu{background:var(--bg);border-radius:12px;padding:8px 0;
  width:100%;max-width:300px;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--text)}
.menu-item{display:flex;align-items:center;gap:14px;
  padding:13px 20px;cursor:pointer;font-size:15px;color:var(--text);
  border:none;background:none;width:100%;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item svg{width:20px;height:20px;fill:var(--text2);flex-shrink:0}
.menu-item.danger{color:#e53935}
.menu-item.danger svg{fill:#e53935}

.theme-switch{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.theme-switch span{font-size:15px}
.switch{width:46px;height:26px;background:var(--border);border-radius:13px;
  position:relative;cursor:pointer;flex-shrink:0}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:23px}

@media(max-width:700px){
  .sidebar{width:100%;min-width:0;border-right:none}
  .app.chat-open .sidebar{display:none}
  .chat-area{display:none}
  .app.chat-open .chat-area{display:flex}
  .modal-overlay{padding:6px}
  .tg-profile{border-radius:14px;max-height:96vh}
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box" id="authBox"></div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" id="burgerBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
      <div class="sidebar-title">Telegram</div>
      <button class="icon-btn" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <input class="search" placeholder="Поиск чатов" id="searchInput">
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>
  <div class="chat-area" id="chatArea"></div>
</div>

<div class="modal-overlay" id="overlay"><div id="overlayContent"></div></div>
<script>
const VERIFIED_SVG=`<svg class="verified" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1da1f2"/><path d="M9.6 16.6l-3.6-3.6 1.4-1.4 2.2 2.2 5.6-5.6 1.4 1.4z" fill="#fff"/></svg>`;
const USER_ICON=`<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
const SAVED_ICON=`<svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 00-2 2v16l7-3 7 3V5a2 2 0 00-2-2z"/></svg>`;

const DATA_VERSION='v5';
const ADMIN_PASS='1019';

let state={user:null,chats:[],activeChatId:null,temp:{},searchQuery:'',theme:'light'};
const authBox=document.getElementById('authBox');
const authScreen=document.getElementById('authScreen');
const app=document.getElementById('app');
const chatListEl=document.getElementById('chatList');
const chatAreaEl=document.getElementById('chatArea');
const overlay=document.getElementById('overlay');
const overlayContent=document.getElementById('overlayContent');

function save(){localStorage.setItem('mtg_state',JSON.stringify(state));localStorage.setItem('mtg_ver',DATA_VERSION)}
function load(){
  try{
    const ver=localStorage.getItem('mtg_ver');
    if(ver!==DATA_VERSION){localStorage.removeItem('mtg_state');return}
    const r=localStorage.getItem('mtg_state');
    if(r)state=Object.assign(state,JSON.parse(r));
  }catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark')}
function genId(){return String(Math.floor(100000000+Math.random()*900000000))}
function formatPhone(p){
  const d=String(p||'').replace(/\D/g,'');
  if(d.length===11&&d[0]==='7')return `+7 (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9,11)}`;
  if(d.length===10)return `+7 (${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6,8)}-${d.slice(8,10)}`;
  return p||'';
}

window.addEventListener('load',()=>{
  load();applyTheme();
  if(state.user){
    if(!state.activeChatId&&state.chats&&state.chats.length){
      state.activeChatId=state.chats[0].id;
      save();
    }
    showApp();
  }else{
    showStepPhone();
  }
});

function stepsHtml(a){return `<div class="steps">${[1,2,3,4].map(i=>`<div class="step-dot ${i<=a?'active':''}"></div>`).join('')}</div>`}

function showStepPhone(){
  authBox.innerHTML=`
    <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></div>
    <h2>Ваш номер телефона</h2>
    <p>Введите номер для продолжения</p>

function renderChats(){
  const q=state.searchQuery.toLowerCase();
  const list=state.chats.filter(c=>c.name.toLowerCase().includes(q)||(c.username||'').toLowerCase().includes(q));
  if(!list.length){
    chatListEl.innerHTML=`<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:14px">${state.chats.length?'Ничего не найдено':'Нет чатов'}</div>`;
    return;
  }
  chatListEl.innerHTML=list.map(c=>{
    const last=c.messages[c.messages.length-1];
    const prev=last?(last.text||'📎'):(c.isSaved?'Сохранить сообщения...':'Нет сообщений');
    const t=last?new Date(last.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    const av=c.photo
      ?`<div class="avatar"><img src="${c.photo}"></div>`
      :`<div class="avatar">${c.isSaved?SAVED_ICON:USER_ICON}</div>`;
    const b=c.verified?VERIFIED_SVG:'';
    return `<div class="chat-item ${c.id===state.activeChatId?'active':''}" data-id="${c.id}">
      ${av}
      <div class="chat-info">
        <div class="chat-name-row">
          <div class="chat-name">${esc(c.name)} ${b}</div>
          <div class="chat-time">${t}</div>
        </div>
        <div class="chat-preview">${esc(prev)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderMessages(chat){
  const box=document.getElementById('messagesBox');if(!box)return;
  if(!chat.messages.length){
    box.innerHTML=`<div class="empty-chat-card">
      <h4>Здесь пока ничего нет...</h4>
      <p>Отправьте сообщение или нажмите на приветствие ниже.</p>
      <div class="sticker">🐕</div>
    </div>`;
    return;
  }
  let html='';
  let lastDate='';
  chat.messages.forEach(m=>{
    const d=new Date(m.ts);
    const dayKey=d.toDateString();
    if(dayKey!==lastDate){
      lastDate=dayKey;
      const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      html+=`<div class="date-sep">${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}</div>`;
    }
    const t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="msg ${m.type}">${esc(m.text)}<span class="time">${t}</span></div>`;
  });
  box.innerHTML=html;
  box.scrollTop=box.scrollHeight;
}

document.addEventListener('click',function(e){
  if(e.target.closest('#newChatBtn')){e.preventDefault();showNewChat();return;}
  if(e.target.closest('#burgerBtn')){e.preventDefault();showMenu();return;}
  const ci=e.target.closest('.chat-item');
  if(ci&&ci.dataset.id){openChat(ci.dataset.id);return;}
  if(e.target.closest('#backBtn')){
    app.classList.remove('chat-open');
    renderChats();
    return;
  }
  if(e.target.closest('#headerPill')){
    const chat=state.chats.find(c=>c.id===state.activeChatId);
    if(chat)showContactProfile(chat.id);
    return;
  }
  if(e.target.closest('#chatMenuBtn')){
    e.stopPropagation();
    const dd=document.getElementById('chatDropdown');
    if(dd)dd.classList.toggle('show');
    return;
  }
  const di=e.target.closest('.dropdown-item');
  if(di&&di.dataset.act){
    const chat=state.chats.find(c=>c.id===state.activeChatId);
    if(!chat)return;
    const act=di.dataset.act;
    const dd=document.getElementById('chatDropdown');
    if(dd)dd.classList.remove('show');
    if(act==='profile')showContactProfile(chat.id);
    if(act==='clear'){
      if(confirm('Очистить историю сообщений?')){
        chat.messages=[];save();renderMessages(chat);renderChats();
      }
    }
    if(act==='close'){
      if(confirm('Выйти из чата?')){
        state.chats=state.chats.filter(c=>c.id!==chat.id);
        state.activeChatId=state.chats[0]?.id||null;
        save();
        app.classList.remove('chat-open');
        renderChats();renderChatArea();
      }
    }
    return;
  }
  const dd=document.getElementById('chatDropdown');
  if(dd&&dd.classList.contains('show')&&!e.target.closest('.dropdown')){
    dd.classList.remove('show');
  }
  if(e.target.closest('#sendBtn')){
    const chat=state.chats.find(c=>c.id===state.activeChatId);
    if(!chat)return;
    const input=document.getElementById('msgInput');
    const text=input.value.trim();if(!text)return;
    chat.messages.push({text,type:'out',ts:Date.now()});
    input.value='';input.style.height='auto';
    save();renderMessages(chat);renderChats();
  }
});

function fmtDate(d){
  const dt=new Date(d);if(isNaN(dt))return d;
  const m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const age=new Date().getFullYear()-dt.getFullYear();
  return `${dt.getDate()} ${m[dt.getMonth()]}. ${dt.getFullYear()} (${age} лет)`;
}

function pickPhoto(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      state.user.photo=ev.target.result;save();
      renderChats();renderChatArea();
      closeOverlay();showMyProfile();
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

function showEditProfile(){
  const u=state.user;
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>Изменить профиль</h3>
      <label>Имя</label>
      <input type="text" id="edName" value="${esc(u.name)}" maxlength="20">
      <label>О себе</label>
      <input type="text" id="edBio" value="${esc(u.bio||'')}" maxlength="70">
      <label>День рождения</label>
      <input type="date" id="edBday" value="${u.birthday||''}">
      <button class="modal-btn" id="edSave" type="button">Сохранить</button>
      <button class="modal-btn secondary" id="edCancel" type="button">Отмена</button>
    </div>`;
  document.getElementById('edCancel').onclick=closeOverlay;
  document.getElementById('edSave').onclick=()=>{
    state.user.name=document.getElementById('edName').value.trim()||state.user.name;
    state.user.bio=document.getElementById('edBio').value.trim();
    state.user.birthday=document.getElementById('edBday').value;
    save();renderChats();renderChatArea();

}

function showSettings(){
  const u=state.user;
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>Настройки</h3>
      <label>Имя</label>
      <input type="text" id="setName" value="${esc(u.name)}" maxlength="20">
      <label>@username</label>
      <input type="text" id="setUser" value="${esc(u.username)}" maxlength="24">
      <div class="theme-switch">
        <span>Тёмная тема</span>
        <div class="switch ${state.theme==='dark'?'on':''}" id="themeSw"></div>
      </div>
      <button class="modal-btn" id="setSave" type="button">Сохранить</button>
      <button class="modal-btn secondary" id="setCancel" type="button">Отмена</button>
    </div>`;
  document.getElementById('themeSw').onclick=function(){
    state.theme=state.theme==='dark'?'light':'dark';
    applyTheme();save();
    this.classList.toggle('on',state.theme==='dark');
  };
  document.getElementById('setCancel').onclick=closeOverlay;
  document.getElementById('setSave').onclick=()=>{
    const name=document.getElementById('setName').value.trim();
    let un=document.getElementById('setUser').value.trim();
    if(!un.startsWith('@'))un='@'+un.replace(/@/g,'');
    if(!name){alert('Введите имя');return}
    if(!/^@[a-zA-Z0-9_]{5,}$/.test(un)){alert('Username: латиница, цифры, _, мин 5');return}
    state.user.name=name;state.user.username=un;
    save();renderChats();renderChatArea();
    closeOverlay();showMyProfile();
  };
}

function showNewChat(){
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>Новый чат</h3>
      <label>Имя собеседника</label>
      <input type="text" id="ncName" placeholder="Иван" maxlength="30">
      <label>@username</label>
      <input type="text" id="ncUser" placeholder="@ivan" maxlength="24">
      <button class="modal-btn" id="ncCreate" type="button">Создать чат</button>
      <button class="modal-btn secondary" id="ncCancel" type="button">Отмена</button>
    </div>`;
  overlay.classList.add('active');
  const inp=document.getElementById('ncName');inp.focus();
  document.getElementById('ncCancel').onclick=closeOverlay;
  const create=()=>{
    const name=document.getElementById('ncName').value.trim();
    let un=document.getElementById('ncUser').value.trim();
    if(!name){alert('Введите имя');return}
    if(!un)un='@user'+Math.floor(Math.random()*9999);
    if(!un.startsWith('@'))un='@'+un.replace(/@/g,'');
    const chat={
      id:'chat_'+Date.now()+Math.floor(Math.random()*1000),
      name,username:un,photo:null,messages:[],
      isSaved:false,verified:false,
      phone:'+7 (937) '+Math.floor(100+Math.random()*899)+'-'+Math.floor(10+Math.random()*89)+'-'+Math.floor(10+Math.random()*89),
      bio:'',birthday:''
    };
    state.chats.push(chat);
    state.activeChatId=chat.id;
    save();closeOverlay();
    app.classList.add('chat-open');
    renderChats();renderChatArea();
  };
  document.getElementById('ncCreate').onclick=create;
  document.getElementById('ncUser').addEventListener('keydown',e=>{if(e.key==='Enter')create()});
  document.getElementById('ncName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ncUser').focus()});
}

function showAdminLogin(){
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>🔐 Админ-панель</h3>
      <input type="password" id="adminPass" placeholder="Пароль">
      <button class="modal-btn" id="adminLoginBtn" type="button">Войти</button>
      <button class="modal-btn secondary" id="adminCancelBtn" type="button">Отмена</button>
      <div class="modal-status" id="adminStatus"></div>
    </div>`;
  const inp=document.getElementById('adminPass');inp.focus();
  const st=document.getElementById('adminStatus');
  const login=()=>{
    if(inp.value===ADMIN_PASS){st.className='modal-status ok';st.textContent='✓ Доступ разрешён';setTimeout(showAdminPanel,350)}
    else{st.className='modal-status err';st.textContent='✗ Неверный пароль';inp.value=''}
  };
  document.getElementById('adminLoginBtn').onclick=login;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  document.getElementById('adminCancelBtn').onclick=closeOverlay;
}

function showAdminPanel(){
  overlayContent.innerHTML=`
    <div class="modal">
      <h3>👑 Админ-панель</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Аккаунт: <b>${esc(state.user.name)}</b> ${esc(state.user.username)}</p>
      <button class="modal-btn ${state.user.verified?'danger':''}" id="toggleVerify" type="button">${state.user.verified?'Убрать галочку':'Выдать синюю галочку ✓'}</button>
      <button class="modal-btn secondary" id="closeAdmin" type="button">Закрыть</button>
      <div class="modal-status" id="adminStatus2"></div>
    </div>`;
  document.getElementById('toggleVerify').onclick=()=>{
    state.user.verified=!state.user.verified;save();
    renderChats();renderChatArea();
    const st=document.getElementById('adminStatus2');
    st.className='modal-status ok';
    st.textContent=state.user.verified?'✓ Галочка выдана!':'✓ Галочка снята';
    setTimeout(showAdminPanel,500);
  };
  document.getElementById('closeAdmin').onclick=closeOverlay;
}
</script>
