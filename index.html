<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Web</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { background: #fff; height: 100vh; overflow: hidden; }

/* ЭКРАН РЕГИСТРАЦИИ */
.auth-screen {
  position: fixed; inset: 0; background: linear-gradient(135deg, #517da2 0%, #6ab3f3 100%);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.auth-box {
  background: #fff; width: 380px; max-width: 92%; border-radius: 12px;
  padding: 40px 32px; box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center;
}
.auth-logo { width: 80px; height: 80px; margin: 0 auto 20px; background: #517da2;
  border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.auth-logo svg { width: 50px; height: 50px; fill: #fff; }
.auth-box h2 { font-size: 22px; color: #000; font-weight: 600; margin-bottom: 6px; }
.auth-box p { font-size: 14px; color: #707579; margin-bottom: 28px; line-height: 1.4; }
.auth-input {
  width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #dadce0;
  border-radius: 10px; outline: none; margin-bottom: 14px; transition: .2s;
}
.auth-input:focus { border-color: #517da2; }
.auth-btn {
  width: 100%; padding: 13px; background: #517da2; color: #fff; border: none;
  border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; transition: .2s;
}
.auth-btn:hover { background: #3d6a8f; }
.auth-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ГЛАВНЫЙ ИНТЕРФЕЙС */
.app { display: none; height: 100vh; }
.app.active { display: flex; }

/* САЙДБАР */
.sidebar {
  width: 380px; min-width: 380px; background: #fff; border-right: 1px solid #e4e4e4;
  display: flex; flex-direction: column; height: 100vh;
}
.sidebar-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #fff; border-bottom: 1px solid #e4e4e4; height: 60px;
}
.burger { font-size: 22px; color: #707579; cursor: pointer; padding: 6px; border-radius: 50%; }
.burger:hover { background: #f4f4f5; }
.search-wrap { flex: 1; }
.search {
  width: 100%; padding: 8px 12px; background: #f4f4f5; border: none; border-radius: 20px;
  outline: none; font-size: 14px;
}
.search::placeholder { color: #a2acb4; }

.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer;
  transition: .15s; border-bottom: 1px solid #f4f4f5;
}
.chat-item:hover { background: #f4f4f5; }
.chat-item.active { background: #517da2; }
.chat-item.active .chat-name, .chat-item.active .chat-preview { color: #fff; }
.avatar {
  width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg,#6ab3f3,#517da2);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600;
  font-size: 20px; flex-shrink: 0; position: relative;
}
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-size: 15px; font-weight: 600; color: #000; display: flex; align-items: center; gap: 4px; }
.chat-preview { font-size: 13px; color: #707579; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.verified { width: 16px; height: 16px; flex-shrink: 0; }

/* ОБЛАСТЬ ЧАТА */
.chat-area {
  flex: 1; display: flex; flex-direction: column; height: 100vh;
  background: #e6ebee; background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d3dbe0' fill-opacity='0.5'%3E%3Ccircle cx='20' cy='20' r='3'/%3E%3Ccircle cx='60' cy='60' r='2'/%3E%3Ccircle cx='40' cy='50' r='2.5'/%3E%3C/g%3E%3C/svg%3E");
}
.chat-header {
  display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff;
  border-bottom: 1px solid #e4e4e4; height: 60px;
}
.chat-header .avatar { width: 42px; height: 42px; font-size: 16px; }
.chat-header-info .chat-name { font-size: 16px; }
.chat-header-info .status { font-size: 13px; color: #707579; }

.messages { flex: 1; overflow-y: auto; padding: 20px 8%; display: flex; flex-direction: column; gap: 8px; }
.msg {
  max-width: 60%; padding: 8px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4;
  word-wrap: break-word; position: relative; animation: msgIn .2s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.out {
  align-self: flex-end; background: #effdde; color: #000; border-bottom-right-radius: 4px;
}
.msg.in {
  align-self: flex-start; background: #fff; color: #000; border-bottom-left-radius: 4px;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.msg .time { font-size: 11px; color: #707579; float: right; margin: 4px 0 0 8px; }

.input-area {
  display: flex; align-items: flex-end; gap: 8px; padding: 10px 16px; background: #fff;
  border-top: 1px solid #e4e4e4;
}
.input-area textarea {
  flex: 1; resize: none; border: none; outline: none; font-size: 15px; font-family: inherit;
  max-height: 120px; padding: 10px 14px; background: #f4f4f5; border-radius: 20px; line-height: 1.4;
}
.send-btn {
  width: 44px; height: 44px; border-radius: 50%; background: #517da2; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: .15s;
}
.send-btn:hover { background: #3d6a8f; }
.send-btn svg { width: 22px; height: 22px; fill: #fff; }

/* АДМИН ПАНЕЛЬ */
.admin-fab {
  position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
  background: #517da2; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center; z-index: 500;
}
.admin-fab:hover { background: #3d6a8f; }
.admin-fab svg { width: 26px; height: 26px; fill: #fff; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
  align-items: center; justify-content: center; z-index: 2000;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 12px; padding: 28px; width: 360px; max-width: 92%;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal h3 { font-size: 18px; margin-bottom: 16px; color: #000; }
.modal input {
  width: 100%; padding: 11px 14px; border: 2px solid #dadce0; border-radius: 10px;
  outline: none; font-size: 15px; margin-bottom: 14px;
}
.modal input:focus { border-color: #517da2; }
.modal-btn {
  width: 100%; padding: 12px; background: #517da2; color: #fff; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 8px;
}
.modal-btn:hover { background: #3d6a8f; }
.modal-btn.danger { background: #e53935; }
.modal-btn.danger:hover { background: #c62828; }
.modal-btn.secondary { background: #f4f4f5; color: #000; }
.modal-btn.secondary:hover { background: #e4e4e5; }
.modal-status { font-size: 13px; margin-top: 8px; min-height: 18px; }
.modal-status.ok { color: #4caf50; }
.modal-status.err { color: #e53935; }

@media (max-width: 700px) {
  .sidebar { width: 100%; min-width: 0; }
  .app.chat-open .sidebar { display: none; }
  .chat-area { display: none; }
  .app.chat-open .chat-area { display: flex; }
}
</style>
</head>
<body>

<!-- РЕГИСТРАЦИЯ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    </div>
    <h2>Добро пожаловать</h2>
    <p>Введите ваше имя и пароль для создания аккаунта</p>
    <input class="auth-input" id="regName" placeholder="Ваше имя" maxlength="20">
    <input class="auth-input" id="regPass" type="password" placeholder="Пароль" maxlength="30">
    <button class="auth-btn" id="regBtn">Начать общение</button>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="burger" id="burger">☰</div>
      <div class="search-wrap"><input class="search" placeholder="Поиск"></div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="chat-header">
      <div class="avatar" id="headerAvatar">Я</div>
      <div class="chat-header-info">
        <div class="chat-name" id="headerName">Избранное <span id="headerBadge"></span></div>
        <div class="status">онлайн</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <textarea id="msgInput" placeholder="Написать сообщение..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- АДМИН КНОПКА -->
<button class="admin-fab" id="adminFab" style="display:none">
  <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
</button>

<!-- МОДАЛКА АДМИНА -->
<div class="modal-overlay" id="adminOverlay">
  <div class="modal" id="adminModal"></div>
</div>

<script>
const VERIFIED_SVG = `<svg class="verified" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1da1f2"/><path d="M9.5 16.5l-3.5-3.5 1.4-1.4 2.1 2.1 5.6-5.6 1.4 1.4z" fill="#fff"/></svg>`;

let state = {
  user: null,
  messages: [],
  isVerified: false,
  adminOpen: false
};

// ===== РЕГИСТРАЦИЯ =====
document.getElementById('regBtn').onclick = () => {
  const name = document.getElementById('regName').value.trim();
  const pass = document.getElementById('regPass').value.trim();
  if (!name || !pass) { alert('Заполните все поля'); return; }
  state.user = { name, pass };
  localStorage.setItem('tg_user', JSON.stringify(state.user));
  startApp();
};

// Автологин
window.addEventListener('load', () => {
  const saved = localStorage.getItem('tg_user');
  if (saved) {
    try {
      state.user = JSON.parse(saved);
      state.messages = JSON.parse(localStorage.getItem('tg_msgs') || '[]');
      state.isVerified = localStorage.getItem('tg_verified') === '1';
      startApp();
    } catch(e) { localStorage.clear(); }
  }
});

function startApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('adminFab').style.display = 'flex';
  renderChats();
  renderHeader();
  renderMessages();
}

// ===== ЧАТЫ =====
function renderChats() {
  const list = document.getElementById('chatList');
  const initial = state.user.name[0].toUpperCase();
  list.innerHTML = `
    <div class="chat-item active">
      <div class="avatar">${initial}</div>
      <div class="chat-info">
        <div class="chat-name">Избранное ${state.isVerified ? VERIFIED_SVG : ''}</div>
        <div class="chat-preview">${state.messages.length ? state.messages[state.messages.length-1].text : 'Сохранить сообщения...'}</div>
      </div>
    </div>
  `;
}

function renderHeader() {
  document.getElementById('headerName').innerHTML =
    state.user.name + ' ' + (state.isVerified ? VERIFIED_SVG : '');
  document.getElementById('headerAvatar').textContent = state.user.name[0].toUpperCase();
}

// ===== СООБЩЕНИЯ =====
function renderMessages() {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  state.messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.type;
    const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = escapeHtml(m.text) + `<span class="time">${time}</span>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  state.messages.push({ text, type: 'out', ts: Date.now() });
  // авто-эхо от себя же (чтобы было "как бы сам с собой")
  setTimeout(() => {
    state.messages.push({ text, type: 'in', ts: Date.now() });
    saveAndRender();
  }, 600);
  input.value = '';
  input.style.height = 'auto';
  saveAndRender();
}

function saveAndRender() {
  localStorage.setItem('tg_msgs', JSON.stringify(state.messages));
  renderMessages();
  renderChats();
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ===== АДМИН ПАНЕЛЬ =====
const adminFab = document.getElementById('adminFab');
const adminOverlay = document.getElementById('adminOverlay');
const adminModal = document.getElementById('adminModal');

adminFab.onclick = () => {
  adminOverlay.classList.add('active');
  if (!state.adminOpen) renderAdminLogin();
};

adminOverlay.onclick = e => {
  if (e.target === adminOverlay) {
    adminOverlay.classList.remove('active');
    state.adminOpen = false;
  }
};

function renderAdminLogin() {
  adminModal.innerHTML = `
    <h3>🔐 Вход в админ-панель</h3>
    <input type="password" id="adminPass" placeholder="Введите пароль" autocomplete="off">
    <button class="modal-btn" id="adminLoginBtn">Войти</button>
    <button class="modal-btn secondary" id="adminCancelBtn">Отмена</button>
    <div class="modal-status" id="adminStatus"></div>
  `;
  document.getElementById('adminLoginBtn').onclick = () => {
    const pass = document.getElementById('adminPass').value;
    const st = document.getElementById('adminStatus');
    if (pass === '1212') {
      st.className = 'modal-status ok';
      st.textContent = '✓ Доступ разрешён';
      setTimeout(renderAdminPanel, 400);
    } else {
      st.className = 'modal-status err';
      st.textContent = '✗ Неверный пароль';
    }
  };
  document.getElementById('adminCancelBtn').onclick = () => {
    adminOverlay.classList.remove('active');
  };
  document.getElementById('adminPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('adminLoginBtn').click();
  });
}

function renderAdminPanel() {
  state.adminOpen = true;
  adminModal.innerHTML = `
    <h3>👑 Админ-панель</h3>
    <p style="font-size:13px;color:#707579;margin-bottom:16px;">
      Управление аккаунтом: <b>${escapeHtml(state.user.name)}</b>
    </p>
    <button class="modal-btn ${state.isVerified ? 'danger' : ''}" id="toggleVerify">
      ${state.isVerified ? 'Убрать синюю галочку' : 'Выдать синюю галочку ✓'}
    </button>
    <button class="modal-btn secondary" id="logoutBtn">Выйти из аккаунта</button>
    <button class="modal-btn secondary" id="closeAdmin">Закрыть</button>
    <div class="modal-status" id="adminStatus2"></div>
  `;
  document.getElementById('toggleVerify').onclick = () => {
    state.isVerified = !state.isVerified;
    localStorage.setItem('tg_verified', state.isVerified ? '1' : '0');
    const st = document.getElementById('adminStatus2');
    st.className = 'modal-status ok';
    st.textContent = state.isVerified ? '✓ Галочка выдана!' : '✓ Галочка снята';
    renderHeader();
    renderChats();
    setTimeout(renderAdminPanel, 600);
  };
  document.getElementById('logoutBtn').onclick = () => {
    if (confirm('Выйти из аккаунта?')) {
      localStorage.clear();
      location.reload();
    }
  };
  document.getElementById('closeAdmin').onclick = () => {
    adminOverlay.classList.remove('active');
    state.adminOpen = false;
  };
}
</script>
</body>
  </html>
